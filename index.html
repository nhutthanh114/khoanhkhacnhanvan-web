<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoảnh Khắc Nhân Văn 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --primary-blue: #00a8f3;
            --primary-pink: #ff69b4;
            --bg-gradient: linear-gradient(135deg, #cceeff 0%, #ffd6e8 100%);
            --white-glass: rgba(255, 255, 255, 0.85);
            --text-dark: #333;
            --text-blue: #1b539e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 3px 3px 0px var(--primary-blue), 6px 6px 0px rgba(0,0,0,0.1);
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, #a5b4fc, #fbcfe8);
            -webkit-background-clip: text;
            -webkit-text-stroke: 2px white;
        }

        .header p {
            font-size: 1.2rem;
            color: var(--text-blue);
            font-weight: bold;
            background: var(--white-glass);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* --- TABS --- */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--white-glass);
            border: 2px solid #fff;
            padding: 12px 30px;
            border-radius: 30px;
            color: var(--primary-blue);
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .tab-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .tab-btn.active {
            background: linear-gradient(45deg, var(--primary-blue), #5bc0de);
            color: #fff;
            border-color: transparent;
        }

        /* --- GALLERY GRID --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 35px;
            padding-bottom: 50px;
        }

        /* --- POLAROID CARD --- */
        .card {
            background: #fff;
            padding: 15px 15px 25px 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: scale(1.03) rotate(-1deg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .card:nth-child(even):hover {
            transform: scale(1.03) rotate(1deg);
        }

        .card-img-wrapper {
            width: 100%;
            height: 280px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #f0f0f0;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--primary-pink);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 2px 10px rgba(255, 105, 180, 0.5);
            z-index: 2;
        }

        .card .multi-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 2;
        }

        .card-info {
            flex-grow: 1;
        }

        .card-info h3 {
            color: var(--text-blue);
            font-size: 1.2rem;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-info p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .card-info .caption-preview {
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- DETAIL VIEW --- */
        .detail-view {
            display: none;
            background: var(--white-glass);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            margin-bottom: 50px;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .nav-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-blue);
            cursor: pointer;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 10px 20px;
            background: #fff;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--text-blue);
            color: #fff;
        }

        .vote-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-pink);
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: all 0.2s;
        }

        .vote-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
        }

        .detail-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 40px;
        }

        /* --- PRODUCT STYLE IMAGE VIEWER --- */
        .image-viewer {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-image-wrapper {
            width: 100%;
            background: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-image-wrapper img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }

        .thumbnails-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .thumbnails-list::-webkit-scrollbar {
            height: 6px;
        }
        
        .thumbnails-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .thumbnails-list::-webkit-scrollbar-thumb {
            background: var(--primary-pink);
            border-radius: 10px;
        }

        .thumbnails-list img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.5;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .thumbnails-list img:hover {
            opacity: 1;
        }

        .thumbnails-list img.active {
            border-color: var(--primary-pink);
            opacity: 1;
        }

        .detail-info {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .detail-info h2 {
            color: var(--primary-blue);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .info-row {
            margin-bottom: 8px;
            font-size: 1rem;
            color: #555;
        }

        .info-row strong {
            color: var(--text-dark);
        }

        .caption-box {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px dashed #eee;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #444;
            white-space: pre-wrap;
        }

        #loader {
            text-align: center;
            color: var(--text-blue);
            font-weight: bold;
            font-size: 1.5rem;
            padding: 50px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* --- LIGHTBOX (FULLSCREEN IMAGE) --- */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 4px;
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            transition: 0.3s;
        }

        .close-lightbox:hover {
            color: #fff;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .detail-layout {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2.2rem;
            }
            .detail-view {
                padding: 20px;
            }
            .nav-actions {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            .vote-btn, .back-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Khoảnh Khắc Nhân Văn</h1>
        <!-- <p>Cuộc thi ảnh ĐHQG-HCM 2026</p> -->
    </div>

    <div id="loader">Đang tải dữ liệu tác phẩm...</div>

    <!-- Màn hình danh sách -->
    <div id="listView" style="display: none;">
        <div class="tabs" id="tabsContainer"></div>
        <div class="gallery" id="galleryContainer"></div>
    </div>

    <!-- Màn hình chi tiết bài thi -->
    <div id="detailView" class="detail-view">
        <div class="nav-actions">
            <div class="back-btn" onclick="goBack()">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Quay lại
            </div>
            <!-- Nút điều hướng về Facebook sẽ được cập nhật link động bằng JS -->
            <a href="https://www.facebook.com/ussh.vnuhcm" target="_blank" class="vote-btn" id="dynamicVoteBtn">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor" stroke="none"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                Bình chọn
            </a>
        </div>
        <div id="detailContent" class="detail-layout"></div>
    </div>
</div>

<!-- Modal xem ảnh toàn màn hình -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close-lightbox">&times;</span>
    <img id="lightbox-img" src="" alt="Hình ảnh toàn màn hình">
</div>

<script>
    // URL của Google Apps Script (Thay bằng link Web App của bạn sau khi deploy)
    const API_URL = 'https://script.google.com/macros/s/AKfycbxGQXs83-y4YryOoH52CqbCVlzOa-NExAPWsWLDCJ8ALqO-sgRlw0lePJwKio5d4Y7O/exec'; 

    let globalData = {};

    // Hàm chuyển đổi link Drive để hiển thị được thẻ <img>
    function formatDriveImage(url) {
        if (!url) return '';
        let id = '';
        
        // Trích xuất ID từ link dạng /d/ID/view hoặc ?id=ID
        const matchD = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        const matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        
        if (matchD && matchD[1]) {
            id = matchD[1];
        } else if (matchId && matchId[1]) {
            id = matchId[1];
        }

        if (id) {
            // Sử dụng Google Drive Thumbnail API để vượt qua chính sách CORS/Cookie mới
            return `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
        }
        
        // Trả về url gốc nếu không nhận diện được ID Drive
        return url;
    }

    async function init() {
        try {
            if (API_URL !== '') {
                // Nếu có API thật, sẽ gọi API
                const response = await fetch(API_URL);
                const json = await response.json();
                globalData = json.data;
            } else {
                // Nếu không có API, dùng dữ liệu mẫu (Mock Data)
                console.log("Đang sử dụng dữ liệu mẫu (Mock Data)");
                globalData = MOCK_DATA;
                // Giả lập thời gian tải nghiệm
                await new Promise(resolve => setTimeout(resolve, 800));
            }

            document.getElementById('loader').style.display = 'none';

            // Kiểm tra xem URL có chứa ?id=... không
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            if (idParam) {
                showDetail(idParam);
            } else {
                renderCategories();
            }
        } catch (error) {
            document.getElementById('loader').innerText = "Lỗi kết nối dữ liệu. Vui lòng thử lại sau.";
            console.error("Fetch error: ", error);
        }
    }

    function renderCategories() {
        document.getElementById('listView').style.display = 'block';
        document.getElementById('detailView').style.display = 'none';
        
        const tabsContainer = document.getElementById('tabsContainer');
        tabsContainer.innerHTML = '';
        const categories = Object.keys(globalData);

        if (categories.length === 0) {
            document.getElementById('galleryContainer').innerHTML = "<p style='text-align:center; width: 100%; color: var(--text-blue);'>Chưa có dữ liệu bài thi.</p>";
            return;
        }

        categories.forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGallery(cat);
            };
            tabsContainer.appendChild(btn);
        });

        // Hiển thị tab đầu tiên mặc định
        renderGallery(categories[0]);
    }

    function renderGallery(category) {
        const gallery = document.getElementById('galleryContainer');
        gallery.innerHTML = '';
        const items = globalData[category] || [];

        items.forEach(item => {
            const firstImg = formatDriveImage(item.images[0]);
            const isMultiple = item.images.length > 1;

            const card = document.createElement('div');
            card.className = 'card';
            
            card.onclick = () => {
                window.history.pushState({}, '', `?id=${item.id}`);
                showDetail(item.id);
            };

            card.innerHTML = `
                <div class="card-img-wrapper">
                    <div class="badge">${item.id}</div>
                    ${isMultiple ? `<div class="multi-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        1/${item.images.length}
                    </div>` : ''}
                    <img src="${firstImg}" alt="${item.fullName}" loading="lazy">
                </div>
                <div class="card-info">
                    <h3>${item.fullName}</h3>
                    <p>🏢 ${item.unit}</p>
                    <div class="caption-preview">"${item.caption}"</div>
                </div>
            `;
            gallery.appendChild(card);
        });
    }

    function showDetail(id) {
        document.getElementById('listView').style.display = 'none';
        const detailView = document.getElementById('detailView');
        const detailContent = document.getElementById('detailContent');
        
        detailView.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // Tìm tác phẩm có ID tương ứng
        let targetItem = null;
        for (const cat in globalData) {
            const found = globalData[cat].find(i => i.id === id);
            if (found) {
                targetItem = found;
                break;
            }
        }

        if (!targetItem) {
            detailContent.innerHTML = `<h2 style="grid-column: 1/-1; text-align:center;">Không tìm thấy tác phẩm mã số ${id}</h2>`;
            return;
        }

        // Bố cục Layout Sản phẩm
        const firstImgUrl = formatDriveImage(targetItem.images[0]);
        let thumbnailsHtml = '';

        if (targetItem.images.length > 1) {
            thumbnailsHtml = `<div class="thumbnails-list">` + 
                targetItem.images.map((url, index) => {
                    const formattedUrl = formatDriveImage(url);
                    return `<img src="${formattedUrl}" class="${index === 0 ? 'active' : ''}" onclick="changeMainImage(this.src, this)" alt="Hình nhỏ ${index + 1}">`;
                }).join('') + 
                `</div>`;
        }

        // Cập nhật link Nút bình chọn
        const voteBtn = document.getElementById('dynamicVoteBtn');
        if (targetItem.fbLink && targetItem.fbLink.trim() !== "") {
            voteBtn.href = targetItem.fbLink;
            voteBtn.style.display = 'inline-flex';
        } else {
            // Nếu chưa có link, trỏ về Fanpage hoặc ẩn đi tùy BTC
            voteBtn.href = "https://www.facebook.com/ussh.vnuhcm"; 
        }

        detailContent.innerHTML = `
            <div class="image-viewer">
                <div class="main-image-wrapper" onclick="openLightbox(document.getElementById('mainDetailImage').src)">
                    <img id="mainDetailImage" src="${firstImgUrl}" alt="Khoảnh khắc nhân văn - ${targetItem.id}">
                </div>
                ${thumbnailsHtml}
            </div>
            <div class="detail-info">
                <h2>${targetItem.fullName}</h2>
                <div class="info-row"><strong>Mã số tác phẩm:</strong> <span style="background: var(--text-blue); color: white; padding: 2px 8px; border-radius: 5px; font-weight: bold;">${targetItem.id}</span></div>
                <div class="info-row"><strong>Đơn vị:</strong> ${targetItem.unit}</div>
                <div class="info-row"><strong>Mã số VC-NLĐ/người học:</strong> ${targetItem.number}</div>               
<strong>Thông điệp tác phẩm:</strong><br>
                    ${targetItem.caption}
            </div>
        `;
    }

    // Các hàm tương tác với bộ xem ảnh
    function changeMainImage(srcUrl, element) {
        // Đổi ảnh lớn
        document.getElementById('mainDetailImage').src = srcUrl;
        
        // Đổi trạng thái active cho thumbnail
        const thumbs = document.querySelectorAll('.thumbnails-list img');
        thumbs.forEach(thumb => thumb.classList.remove('active'));
        element.classList.add('active');
    }

    function openLightbox(url) {
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        lightboxImg.src = url;
        lightbox.style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
        document.getElementById('lightbox-img').src = '';
    }

    function goBack() {
        // Xóa param ?id khỏi URL mà không load lại trang
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.pushState({path:newUrl}, '', newUrl);
        renderCategories();
    }

    // Xử lý sự kiện nút Back của trình duyệt
    window.onpopstate = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');
        if (idParam) {
            showDetail(idParam);
        } else {
            renderCategories();
        }
    };

    // Khởi chạy
    window.onload = init;
</script>

</body>
</html>
