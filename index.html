<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoảnh Khắc Nhân Văn 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --primary-blue: #00a8f3;
            --primary-pink: #ff69b4;
            --bg-gradient: linear-gradient(135deg, #cceeff 0%, #ffd6e8 100%);
            --white-glass: rgba(255, 255, 255, 0.85);
            --text-dark: #333;
            --text-blue: #1b539e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        /* --- HEADER --- */
        .header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        .header h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 3px 3px 0px var(--primary-blue), 6px 6px 0px rgba(0,0,0,0.1);
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, #a5b4fc, #fbcfe8);
            -webkit-background-clip: text;
            -webkit-text-stroke: 2px white;
        }
        .header p {
            font-size: 1.2rem; color: var(--text-blue); font-weight: bold;
            background: var(--white-glass); display: inline-block;
            padding: 5px 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* --- TABS --- */
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--white-glass); border: 2px solid #fff; padding: 12px 30px;
            border-radius: 30px; color: var(--primary-blue); font-weight: 700;
            font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .tab-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .tab-btn.active { background: linear-gradient(45deg, var(--primary-blue), #5bc0de); color: #fff; border-color: transparent; }

        /* --- GALLERY GRID --- */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 35px; padding-bottom: 50px; }

        /* --- POLAROID CARD --- */
        .card {
            background: #fff; padding: 15px 15px 25px 15px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); cursor: pointer;
            transition: all 0.4s ease; position: relative; display: flex; flex-direction: column;
        }
        .card:hover { transform: scale(1.03) rotate(-1deg); box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
        .card:nth-child(even):hover { transform: scale(1.03) rotate(1deg); }

        .card-img-wrapper { width: 100%; height: 280px; border-radius: 8px; overflow: hidden; margin-bottom: 15px; background: #f0f0f0; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .card:hover img { transform: scale(1.05); }

        .card .badge { position: absolute; top: 10px; left: 10px; background: var(--primary-pink); color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; box-shadow: 0 2px 10px rgba(255, 105, 180, 0.5); z-index: 2; }
        .card .multi-icon { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 5px 8px; border-radius: 5px; font-size: 12px; z-index: 2; }

        .card-info { flex-grow: 1; }
        .card-info h3 { color: var(--text-blue); font-size: 1.2rem; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .card-info p { font-size: 0.9rem; color: #666; margin-bottom: 10px; }
        .card-info .caption-preview { font-size: 0.9rem; color: #888; font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* --- DETAIL VIEW --- */
        .detail-view { display: none; background: var(--white-glass); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); margin-bottom: 50px; border: 2px solid rgba(255,255,255,0.5); }
        .nav-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-blue); cursor: pointer; font-weight: 800; font-size: 1.1rem; padding: 10px 20px; background: #fff; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: all 0.2s; }
        .back-btn:hover { background: var(--text-blue); color: #fff; }
        .vote-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--primary-pink); color: #fff; text-decoration: none; font-weight: 800; font-size: 1.1rem; padding: 10px 25px; border-radius: 30px; box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4); transition: all 0.2s; border: none; cursor: pointer; }
        .vote-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6); }

        .detail-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; }

        .image-viewer { display: flex; flex-direction: column; gap: 15px; }
        .main-image-wrapper { width: 100%; background: #f0f0f0; border-radius: 12px; overflow: hidden; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative; display: flex; justify-content: center; align-items: center; }
        .main-image-wrapper img { width: 100%; max-height: 500px; object-fit: contain; display: block; }
        .thumbnails-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .thumbnails-list::-webkit-scrollbar { height: 6px; }
        .thumbnails-list::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .thumbnails-list::-webkit-scrollbar-thumb { background: var(--primary-pink); border-radius: 10px; }
        .thumbnails-list img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; opacity: 0.5; transition: all 0.2s; flex-shrink: 0; }
        .thumbnails-list img.active { border-color: var(--primary-pink); opacity: 1; }

        .detail-info { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); height: fit-content; position: sticky; top: 20px; }
        .detail-info h2 { color: var(--primary-blue); font-size: 1.8rem; margin-bottom: 10px; }
        .info-row { margin-bottom: 8px; font-size: 1rem; color: #555; }
        .info-row strong { color: var(--text-dark); }
        .caption-box { margin-top: 25px; padding-top: 25px; border-top: 2px dashed #eee; font-size: 1.05rem; line-height: 1.7; color: #444; white-space: pre-wrap; }

        #loader { text-align: center; color: var(--text-blue); font-weight: bold; font-size: 1.5rem; padding: 50px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* --- LIGHTBOX & POPUP --- */
        .lightbox, .custom-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 4px; }
        .close-btn { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 10000; transition: 0.3s; }
        .close-btn:hover { color: var(--primary-pink); }

        .popup-box { background: #fff; width: 90%; max-width: 450px; padding: 40px 30px; border-radius: 20px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); border: 4px solid var(--primary-blue); position: relative; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .popup-icon { font-size: 50px; color: var(--primary-pink); margin-bottom: 20px; }
        .popup-box h4 { font-size: 1.5rem; color: var(--text-blue); margin-bottom: 15px; }
        .popup-box p { font-size: 1.05rem; line-height: 1.6; color: #555; margin-bottom: 25px; }
        .close-popup-btn { background: var(--primary-blue); color: white; border: none; padding: 12px 35px; border-radius: 30px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .close-popup-btn:hover { background: var(--text-blue); transform: scale(1.05); }

        @media (max-width: 768px) {
            .detail-layout { grid-template-columns: 1fr; }
            .header h1 { font-size: 2.2rem; }
            .detail-view { padding: 20px; }
            .nav-actions { flex-direction: column; gap: 15px; align-items: stretch; }
            .vote-btn, .back-btn { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Khoảnh Khắc Nhân Văn</h1>
    </div>

    <div id="loader">Đang tải dữ liệu tác phẩm...</div>

    <div id="listView" style="display: none;">
        <div class="tabs" id="tabsContainer"></div>
        <div class="gallery" id="galleryContainer"></div>
    </div>

    <div id="detailView" class="detail-view">
        <div class="nav-actions">
            <div class="back-btn" onclick="goBack()">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Quay lại
            </div>
            <button class="vote-btn" id="dynamicVoteBtn" onclick="handleVoteClick()">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor" stroke="none"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                Bình chọn
            </button>
        </div>
        <div id="detailContent" class="detail-layout"></div>
    </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <img id="lightbox-img" src="" alt="Hình ảnh toàn màn hình">
</div>

<div id="votingPopup" class="custom-popup">
    <div class="popup-box">
        <div class="popup-icon"><i class="fa-solid fa-clock-rotate-left"></i> ⏳</div>
        <h4>Thông báo bình chọn</h4>
        <div id="popupMessage"></div>
        <button class="close-popup-btn" onclick="closePopup()">Đóng</button>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxGQXs83-y4YryOoH52CqbCVlzOa-NExAPWsWLDCJ8ALqO-sgRlw0lePJwKio5d4Y7O/exec'; 

    let globalData = {};
    let globalVotingPeriods = {};
    let currentViewingItem = null;
    let isBlindMode = false; // Biến lưu trạng thái Ban Giám Khảo

    function formatDriveImage(url) {
        if (!url) return '';
        let id = '';
        const matchD = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        const matchId = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (matchD && matchD[1]) id = matchD[1];
        else if (matchId && matchId[1]) id = matchId[1];
        return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
    }

    // Hàm format thời gian theo yêu cầu: 15:00 ngày 01/04/2026
    function formatTimeForPopup(timestamp) {
        if (!timestamp) return "Chưa xác định";
        const d = new Date(timestamp);
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        return `${hh}:${mm} ngày ${dd}/${mo}/${yyyy}`;
    }

    async function init() {
        try {
            // Kiểm tra trạng thái BGK trên URL khi load trang
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'bgk') {
                isBlindMode = true;
            }

            const response = await fetch(API_URL);
            const json = await response.json();
            globalData = json.data;
            globalVotingPeriods = json.votingPeriods || {};

            document.getElementById('loader').style.display = 'none';
            
            const idParam = urlParams.get('id');
            if (idParam) showDetail(idParam);
            else renderCategories();
        } catch (error) {
            document.getElementById('loader').innerText = "Lỗi kết nối dữ liệu. Vui lòng thử lại sau.";
        }
    }

    function renderCategories() {
        document.getElementById('listView').style.display = 'block';
        document.getElementById('detailView').style.display = 'none';
        const tabsContainer = document.getElementById('tabsContainer');
        tabsContainer.innerHTML = '';
        const categories = Object.keys(globalData);
        if (categories.length === 0) {
            document.getElementById('galleryContainer').innerHTML = "<p style='text-align:center; width: 100%;'>Chưa có dữ liệu bài thi.</p>";
            return;
        }
        categories.forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGallery(cat);
            };
            tabsContainer.appendChild(btn);
        });
        renderGallery(categories[0]);
    }

    function renderGallery(category) {
        const gallery = document.getElementById('galleryContainer');
        gallery.innerHTML = '';
        const items = globalData[category] || [];
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                // Tạo URL mới, bảo tồn tham số BGK nếu có
                let nextUrl = `?id=${item.id}`;
                if (isBlindMode) nextUrl += `&mode=bgk`;
                window.history.pushState({}, '', nextUrl);
                showDetail(item.id);
            };

            // Ẩn thông tin nếu là BGK
            const displayTitle = isBlindMode ? `Tác phẩm ${item.id}` : item.fullName;
            const unitHtml = isBlindMode ? '' : `<p>🏢 ${item.unit}</p>`;

            card.innerHTML = `
                <div class="card-img-wrapper">
                    <div class="badge">${item.id}</div>
                    ${item.images.length > 1 ? `<div class="multi-icon">1/${item.images.length}</div>` : ''}
                    <img src="${formatDriveImage(item.images[0])}" alt="${displayTitle}" loading="lazy">
                </div>
                <div class="card-info">
                    <h3>${displayTitle}</h3>
                    ${unitHtml}
                    <div class="caption-preview">"${item.caption}"</div>
                </div>
            `;
            gallery.appendChild(card);
        });
    }

    function showDetail(id) {
        document.getElementById('listView').style.display = 'none';
        const detailView = document.getElementById('detailView');
        const detailContent = document.getElementById('detailContent');
        detailView.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        let targetItem = null;
        for (const cat in globalData) {
            const found = globalData[cat].find(i => i.id === id);
            if (found) { targetItem = found; break; }
        }
        if (!targetItem) {
            detailContent.innerHTML = `<h2 style="grid-column: 1/-1; text-align:center;">Không tìm thấy tác phẩm mã số ${id}</h2>`;
            return;
        }

        currentViewingItem = targetItem; // Lưu lại để dùng khi bấm Bình chọn

        const firstImgUrl = formatDriveImage(targetItem.images[0]);
        let thumbnailsHtml = '';
        if (targetItem.images.length > 1) {
            thumbnailsHtml = `<div class="thumbnails-list">` + 
                targetItem.images.map((url, index) => {
                    const fUrl = formatDriveImage(url);
                    return `<img src="${fUrl}" class="${index === 0 ? 'active' : ''}" onclick="changeMainImage(this.src, this)">`;
                }).join('') + `</div>`;
        }

        // Ẩn thông tin nếu là BGK
        const displayTitle = isBlindMode ? `Tác phẩm ${targetItem.id}` : targetItem.fullName;
        const infoRowsHtml = isBlindMode ? '' : `
            <div class="info-row"><strong>Đơn vị:</strong> ${targetItem.unit}</div>
            <div class="info-row"><strong>Mã số VC-NLĐ/người học:</strong> ${targetItem.number}</div>
        `;

        // Ẩn nút bình chọn nếu là BGK
        const voteBtn = document.getElementById('dynamicVoteBtn');
        if (isBlindMode) {
            voteBtn.style.display = 'none';
        } else {
            voteBtn.style.display = 'inline-flex';
        }

        detailContent.innerHTML = `
            <div class="image-viewer">
                <div class="main-image-wrapper" onclick="openLightbox(document.getElementById('mainDetailImage').src)">
                    <img id="mainDetailImage" src="${firstImgUrl}">
                </div>
                ${thumbnailsHtml}
            </div>
            <div class="detail-info">
                <h2>${displayTitle}</h2>
                <div class="info-row"><strong>Mã số tác phẩm:</strong> <span style="background: var(--text-blue); color: white; padding: 2px 8px; border-radius: 5px; font-weight: bold;">${targetItem.id}</span></div>
                ${infoRowsHtml}
                <div class="caption-box"><strong>Thông điệp tác phẩm:</strong><br>${targetItem.caption}</div>
            </div>
        `;
    }

    // Logic kiểm tra thời gian khi click nút Bình chọn
    function handleVoteClick() {
        if (!currentViewingItem) return;
        
        const catName = currentViewingItem.category;
        const period = globalVotingPeriods[catName];
        const now = Date.now();

        // Quy tắc: Nếu không có cấu hình thời gian hoặc cột trống -> Cho phép (Cho phép)
        if (!period || !period.start || !period.end) {
            openVoteLink();
            return;
        }

        // Kiểm tra khoảng thời gian
        if (now >= period.start && now <= period.end) {
            openVoteLink();
        } else {
            // Không nằm trong khoảng thời gian -> Hiện Pop-up
            const startText = formatTimeForPopup(period.start);
            const endText = formatTimeForPopup(period.end);
            
            document.getElementById('popupMessage').innerHTML = `
                <p>Hiện tại không nằm trong khoảng thời gian bình chọn cho tác phẩm trong danh mục <strong>${catName}</strong>.</p>
                <p style="font-size: 0.9rem; color: #666;">
                    <strong>Bắt đầu:</strong> ${startText}<br>
                    <strong>Kết thúc:</strong> ${endText}
                </p>
            `;
            document.getElementById('votingPopup').style.display = 'flex';
        }
    }

    function openVoteLink() {
        const link = (currentViewingItem.fbLink && currentViewingItem.fbLink.trim() !== "") 
                     ? currentViewingItem.fbLink 
                     : "https://www.facebook.com/ussh.vnuhcm";
        window.open(link, '_blank');
    }

    function closePopup() { document.getElementById('votingPopup').style.display = 'none'; }

    function changeMainImage(srcUrl, element) {
        document.getElementById('mainDetailImage').src = srcUrl;
        document.querySelectorAll('.thumbnails-list img').forEach(t => t.classList.remove('active'));
        element.classList.add('active');
    }

    function openLightbox(url) {
        const lightbox = document.getElementById('lightbox');
        document.getElementById('lightbox-img').src = url;
        lightbox.style.display = 'flex';
    }

    function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

    function goBack() {
        // Bảo tồn tham số BGK khi back về trang chủ
        let newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        if (isBlindMode) {
            newUrl += '?mode=bgk';
        }
        window.history.pushState({path:newUrl}, '', newUrl);
        renderCategories();
    }

    window.onpopstate = function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        // Sync lại trạng thái nếu có thay đổi từ history
        if (urlParams.get('mode') === 'bgk') {
            isBlindMode = true;
        }

        const idParam = urlParams.get('id');
        if (idParam) showDetail(idParam);
        else renderCategories();
    };

    window.onload = init;
</script>

</body>
</html>
